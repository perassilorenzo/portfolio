<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>404 — Lorenzo Perassi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    .code {
      font-size: clamp(4rem, 18vw, 8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      background: linear-gradient(135deg, #f5f5f5, #71717a);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 { font-size: 1.15rem; font-weight: 600; margin: 18px 0 10px; }
    p { color: #a1a1aa; font-size: 0.95rem; max-width: 420px; margin: 0 auto 28px; line-height: 1.6; }
    .btn {
      display: inline-block;
      padding: 12px 26px;
      border-radius: 12px;
      background: #f5f5f5;
      color: #0a0a0a;
      font-weight: 700;
      font-size: 0.92rem;
      text-decoration: none;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }
    .btn:hover { transform: translateY(-2px); opacity: 0.9; }
    .lang-switch { margin-top: 22px; font-size: 0.85rem; color: #71717a; }
    .lang-switch button {
      background: none; border: none; color: #a1a1aa;
      cursor: pointer; font-size: inherit; text-decoration: underline;
      padding: 6px;
    }
    [hidden] { display: none !important; }
  </style>
</head>

<body>
  <main>
    <div class="code">404</div>
    <h1 id="t-it">Pagina non trovata</h1>
    <h1 id="t-en" hidden>Page not found</h1>
    <p id="d-it">La pagina che cerchi non esiste o è stata spostata. Torna alla home e riparti da lì.</p>
    <p id="d-en" hidden>The page you're looking for doesn't exist or has been moved. Head back to the homepage.</p>
    <a class="btn" href="/">lorenzoperassi.it</a>
    <div class="lang-switch">
      <button type="button" onclick="setLang('en')" id="sw-en">English</button>
      <button type="button" onclick="setLang('it')" id="sw-it" hidden>Italiano</button>
    </div>
  </main>
  <script>
    function setLang(l) {
      var en = l === "en";
      document.documentElement.lang = l;
      document.getElementById("t-it").hidden = en;
      document.getElementById("d-it").hidden = en;
      document.getElementById("t-en").hidden = !en;
      document.getElementById("d-en").hidden = !en;
      document.getElementById("sw-en").hidden = en;
      document.getElementById("sw-it").hidden = !en;
    }
  </script>
</body>

</html>
